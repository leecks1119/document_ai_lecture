<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">OCR·멀티모달 AI·VLM·Document AI·IDP 관계도</title>
  <desc id="desc">VLM은 멀티모달 AI의 한 종류이며 OCR, VLM, 규칙과 문서 모델이 Document AI 역량에 선택적으로 사용되고, 운영 절차를 결합하면 IDP가 되는 관계</desc>
  <rect width="1280" height="760" fill="#F7FAFC"/>
  <text x="64" y="74" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#173B57">다섯 용어는 같은 층위가 아닙니다</text>
  <text x="64" y="112" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#667085">도구·모델·기술 묶음·운영 프로세스를 구분하면 선택 기준이 보입니다.</text>

  <rect x="64" y="160" width="300" height="190" rx="26" fill="#EAF1F8" stroke="#4B779D" stroke-width="3"/>
  <text x="94" y="205" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#173B57">Multimodal AI</text>
  <text x="94" y="240" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#516273">둘 이상의 양식을 처리하는</text>
  <text x="94" y="266" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#516273">넓은 AI 범주</text>
  <rect x="102" y="286" width="224" height="48" rx="16" fill="#FFFFFF" stroke="#4B779D" stroke-width="2"/>
  <text x="214" y="317" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="21" font-weight="700" fill="#173B57">VLM · 한 종류</text>

  <rect x="64" y="405" width="250" height="138" rx="24" fill="#DDF3EE" stroke="#167D7F" stroke-width="3"/>
  <text x="189" y="452" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#173B57">OCR</text>
  <text x="189" y="487" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#516273">이미지에서 텍스트 인식</text>
  <text x="189" y="515" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#516273">제품별 위치·신뢰도 제공</text>

  <rect x="405" y="230" width="380" height="313" rx="30" fill="#FFF8E8" stroke="#E0A72B" stroke-width="4"/>
  <text x="595" y="283" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#6D4B00">Document AI</text>
  <text x="595" y="318" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#6D5B35">문서를 기계가 이해할 구조로 바꾸는</text>
  <text x="595" y="346" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#6D5B35">기술·제품 역량의 묶음</text>
  <rect x="446" y="380" width="130" height="48" rx="15" fill="#FFFFFF"/><text x="511" y="411" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#173B57">분류·분할</text>
  <rect x="596" y="380" width="148" height="48" rx="15" fill="#FFFFFF"/><text x="670" y="411" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#173B57">레이아웃</text>
  <rect x="446" y="446" width="130" height="48" rx="15" fill="#FFFFFF"/><text x="511" y="477" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#173B57">필드 추출</text>
  <rect x="596" y="446" width="148" height="48" rx="15" fill="#FFFFFF"/><text x="670" y="477" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#173B57">정규화</text>

  <path d="M326 310 C370 310 370 330 405 330" fill="none" stroke="#4B779D" stroke-width="5"/>
  <path d="M314 474 C360 474 360 440 405 440" fill="none" stroke="#167D7F" stroke-width="5"/>
  <polygon points="396,322 414,330 396,338" fill="#4B779D"/>
  <polygon points="396,432 414,440 396,448" fill="#167D7F"/>
  <text x="355" y="384" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#667085">필요할 때 선택</text>

  <rect x="875" y="190" width="341" height="390" rx="30" fill="#173B57"/>
  <text x="1045" y="246" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">IDP</text>
  <text x="1045" y="279" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" fill="#DDE7EF">Intelligent Document Processing</text>
  <text x="1045" y="326" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" fill="#FFFFFF">Document AI 역량</text>
  <text x="1045" y="358" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#5ED0C6">+</text>
  <text x="1045" y="398" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#FFFFFF">수집 · 검증 · 예외처리</text>
  <text x="1045" y="430" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#FFFFFF">사람 검토 · 업무 연계</text>
  <text x="1045" y="462" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#FFFFFF">모니터링 · 거버넌스</text>
  <rect x="925" y="500" width="241" height="48" rx="16" fill="#DDF3EE"/>
  <text x="1045" y="531" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#173B57">실제 업무 운영 프로세스</text>

  <line x1="795" y1="386" x2="849" y2="386" stroke="#E0A72B" stroke-width="7" stroke-linecap="round"/>
  <polygon points="841,374 863,386 841,398" fill="#E0A72B"/>

  <rect x="64" y="625" width="1152" height="78" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="640" y="658" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#173B57">주의: 이것은 강의용 관계도입니다.</text>
  <text x="640" y="687" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#667085">제품마다 이름과 포함 기능이 다르며, OCR → VLM → Document AI를 항상 순서대로 거치는 것은 아닙니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">같은 한국 영수증, 서로 다른 역할</title>
  <desc id="desc">OCR은 글자, VLM은 배치와 관계, Document AI는 검증과 저장까지 처리</desc>
  <rect width="1200" height="675" fill="#FFF9EF"/>
  <rect x="36" y="32" width="1128" height="611" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="92" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#173B57">같은 한국 영수증, 서로 다른 역할</text>
  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="72" y="155" width="330" height="340" rx="24" fill="#EAF1F8" stroke="#CBD5E1" stroke-width="2"/><text x="237" y="210" text-anchor="middle" font-size="29" font-weight="600" fill="#173B57"><tspan x="237" dy="0">OCR</tspan></text><text x="100" y="270" text-anchor="start" font-size="21" font-weight="400" fill="#667085"><tspan x="100" dy="0">입력: 이미지 픽셀</tspan><tspan x="100" dy="43">탐지 → 문자 인식</tspan><tspan x="100" dy="43">출력: 글자·좌표·신뢰도</tspan><tspan x="100" dy="43">업무 의미는 별도</tspan></text><rect x="444" y="155" width="330" height="340" rx="24" fill="#DDF3EE" stroke="#CBD5E1" stroke-width="2"/><text x="609" y="210" text-anchor="middle" font-size="29" font-weight="600" fill="#173B57"><tspan x="609" dy="0">VLM</tspan></text><text x="472" y="270" text-anchor="start" font-size="21" font-weight="400" fill="#667085"><tspan x="472" dy="0">입력: 이미지 + 지시</tspan><tspan x="472" dy="43">배치 → 관계 해석</tspan><tspan x="472" dy="43">출력: 표·Markdown·초안</tspan><tspan x="472" dy="43">추론 오류 가능</tspan></text><rect x="816" y="155" width="330" height="340" rx="24" fill="#FFF0D8" stroke="#CBD5E1" stroke-width="2"/><text x="981" y="210" text-anchor="middle" font-size="29" font-weight="600" fill="#173B57"><tspan x="981" dy="0">Document AI</tspan></text><text x="844" y="270" text-anchor="start" font-size="21" font-weight="400" fill="#667085"><tspan x="844" dy="0">입력: 문서 + 업무 규칙</tspan><tspan x="844" dy="43">처리기 → 스키마 → 검증</tspan><tspan x="844" dy="43">출력: 검토 가능한 데이터</tspan><tspan x="844" dy="43">사람 확인 후 저장</tspan></text><rect x="150" y="525" width="900" height="58" rx="18" fill="#173B57"/><text x="600" y="563" text-anchor="middle" font-size="23" font-weight="600" fill="#FFFFFF"><tspan x="600" dy="0">Document AI는 단일 모델이 아니라 문서 업무를 끝내는 전체 흐름입니다.</tspan></text>
  </g>
  <text x="76" y="615" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#667085">Document AI 입문 과정 · 2026</text>
</svg>

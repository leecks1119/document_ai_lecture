<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JSON 품목이 CSV 행으로</title>
  <desc id="desc">JSON의 연필과 노트 품목 배열이 CSV의 두 행으로 변환되는 그림</desc>
  <rect width="1200" height="675" fill="#FFF9EF"/>
  <rect x="36" y="32" width="1128" height="611" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="92" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#173B57">JSON 품목이 CSV 행으로</text>
  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="95" y="165" width="450" height="330" rx="26" fill="#EAF1F8" stroke="#CBD5E1" stroke-width="2"/><rect x="655" y="165" width="450" height="330" rx="26" fill="#DDF3EE" stroke="#CBD5E1" stroke-width="2"/><text x="320" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="320" dy="0">JSON items 배열</tspan></text><text x="880" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="880" dy="0">CSV 표</tspan></text><text x="140" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="140" dy="0">연필 · 2개</tspan><tspan x="140" dy="48">노트 · 1개</tspan><tspan x="140" dy="48">영수증 하나</tspan></text><text x="700" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="700" dy="0">1행 · 연필</tspan><tspan x="700" dy="48">2행 · 노트</tspan><tspan x="700" dy="48">공통 상호명·날짜</tspan></text><line x1="565" y1="330" x2="619" y2="330" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 615 318 L 635 330 L 615 342" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="525" width="840" height="58" rx="18" fill="#173B57"/><text x="600" y="563" text-anchor="middle" font-size="23" font-weight="600" fill="#FFFFFF"><tspan x="600" dy="0">반복 품목 하나가 CSV의 한 행이 됩니다.</tspan></text>
  </g>
  <text x="76" y="615" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#667085">Document AI 입문 과정 · 2026</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">검증 세 갈래와 별도 승인 게이트</title>
  <desc id="desc">검증 결과가 valid, warnings, errors로 갈라지고 valid 경로도 사람 원본 확인 뒤에만 Excel로 가는 그림</desc>
  <rect width="1200" height="675" fill="#FFF9EF"/>
  <rect x="36" y="32" width="1128" height="611" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="92" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#173B57">검증 세 갈래와 별도 승인 게이트</text>
  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="65" y="260" width="180" height="100" rx="22" fill="#EAF1F8" stroke="#CBD5E1" stroke-width="2"/><text x="155" y="300" text-anchor="middle" font-size="27" font-weight="600" fill="#173B57"><tspan x="155" dy="0">규칙 검사</tspan></text><text x="155" y="335" text-anchor="middle" font-size="18" font-weight="400" fill="#667085"><tspan x="155" dy="0">JSON 입력</tspan></text><line x1="245" y1="310" x2="310" y2="310" stroke="#173B57" stroke-width="5"/><polyline points="310,310 310,205 365,205" fill="none" stroke="#248A5B" stroke-width="5"/><rect x="365" y="165" width="210" height="80" rx="20" fill="#FFFFFF" stroke="#248A5B" stroke-width="4"/><text x="470" y="197" text-anchor="middle" font-size="25" font-weight="600" fill="#248A5B"><tspan x="470" dy="0">valid</tspan></text><text x="470" y="226" text-anchor="middle" font-size="17" font-weight="400" fill="#667085"><tspan x="470" dy="0">차단 오류 없음</tspan></text><polyline points="310,310 310,310 365,310" fill="none" stroke="#F4B740" stroke-width="5"/><rect x="365" y="270" width="210" height="80" rx="20" fill="#FFFFFF" stroke="#F4B740" stroke-width="4"/><text x="470" y="302" text-anchor="middle" font-size="25" font-weight="600" fill="#F4B740"><tspan x="470" dy="0">warnings</tspan></text><text x="470" y="331" text-anchor="middle" font-size="17" font-weight="400" fill="#667085"><tspan x="470" dy="0">확인 필요</tspan></text><polyline points="310,310 310,415 365,415" fill="none" stroke="#C23B32" stroke-width="5"/><rect x="365" y="375" width="210" height="80" rx="20" fill="#FFFFFF" stroke="#C23B32" stroke-width="4"/><text x="470" y="407" text-anchor="middle" font-size="25" font-weight="600" fill="#C23B32"><tspan x="470" dy="0">errors</tspan></text><text x="470" y="436" text-anchor="middle" font-size="17" font-weight="400" fill="#667085"><tspan x="470" dy="0">수정 필요</tspan></text><line x1="575" y1="205" x2="675" y2="250" stroke="#167D7F" stroke-width="5"/><line x1="575" y1="310" x2="675" y2="290" stroke="#167D7F" stroke-width="5"/><rect 
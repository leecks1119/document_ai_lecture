  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="283" y="215" width="190" height="190" rx="22" fill="#DDF3EE" stroke="#167D7F" stroke-width="2"/><circle cx="378" cy="263" r="25" fill="#167D7F"/><text x="378" y="272" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="378" dy="0">1</tspan></text><text x="378" y="323" text-anchor="middle" font-size="25" font-weight="600" fill="#173B57"><tspan x="378" dy="0">valid</tspan></text><text x="378" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#667085"><tspan x="378" dy="0">저장 가능</tspan></text><line x1="478" y1="310" x2="484" y2="310" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 480 298 L 500 310 L 480 322" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="505" y="215" width="190" height="190" rx="22" fill="#EAF1F8" stroke="#167D7F" stroke-width="2"/><circle cx="600" cy="263" r="25" fill="#167D7F"/><text x="600" y="272" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="600" dy="0">2</tspan></text><text x="600" y="323" text-anchor="middle" font-size="25" font-weight="600" fill="#173B57"><tspan x="600" dy="0">warnings</tspan></text><text x="600" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#667085"><tspan x="600" dy="0">사람 확인</tspan></text><line x1="700" y1="310" x2="706" y2="310" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 702 298 L 722 310 L 702 322" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="727" y="215" width="190" height="190" rx="22" fill="#DDF3EE" stroke="#167D7F" stroke-width="2"/><circle cx="822" cy="263" r="25" fill="#167D7F"/><text x="822" y="272" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="822" dy="0">3</tspan></text><text x="822" y="323" text-anchor="middle" font-size="25" font-weight="600" fill="#173B57"><tspan x="822" dy="0">errors</tspan></text><text x="8
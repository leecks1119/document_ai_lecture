<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">문서 VLM 결과에서 업무 JSON으로</title>
  <desc id="desc">PaddleOCR-VL의 제목과 표 Markdown을 업무 JSON 필드로 변환하는 그림</desc>
  <rect width="1200" height="675" fill="#FFF9EF"/>
  <rect x="36" y="32" width="1128" height="611" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="92" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#173B57">문서 VLM 결과에서 업무 JSON으로</text>
  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="95" y="165" width="450" height="330" rx="26" fill="#EAF1F8" stroke="#CBD5E1" stroke-width="2"/><rect x="655" y="165" width="450" height="330" rx="26" fill="#DDF3EE" stroke="#CBD5E1" stroke-width="2"/><text x="320" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="320" dy="0">VLM 중간 결과</tspan></text><text x="880" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="880" dy="0">업무 JSON</tspan></text><text x="140" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="140" dy="0"># 상호명</tspan><tspan x="140" dy="48">거래일자 문단</tspan><tspan x="140" dy="48">Markdown 품목 표</tspan><tspan x="140" dy="48">합계 강조</tspan></text><text x="700" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="700" dy="0">&quot;store_name&quot;</tspan><tspan x="700" dy="48">&quot;date&quot;</tspan><tspan x="700" dy="48">&quot;items&quot;: [...]</tspan><tspan x="700" dy="48">&quot;total_amount&quot;</tspan></text><line x1="565" y1="330" x2="619" y2="330" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 615 318 L 635 330 L 615 342" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="525" width="840" height="58" rx="18" fill="#173B57"/><text x="600" y="563" text-anchor="middle" font-size="23" font-weight="600" fill="#FFFFFF"><tspan x="600" dy="0">수업용 예제는 출처 기록을 남기고, 값은 원문 근거와 함께 검증합니다.</tspan></text>
  </g>
  <text x="76" y="615" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#667085">Document AI 입문 과정 · 2026</text>
</svg>

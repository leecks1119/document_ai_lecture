  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="95" y="165" width="450" height="330" rx="26" fill="#EAF1F8" stroke="#CBD5E1" stroke-width="2"/><rect x="655" y="165" width="450" height="330" rx="26" fill="#DDF3EE" stroke="#CBD5E1" stroke-width="2"/><text x="320" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="320" dy="0">LIVE 선택 경로</tspan></text><text x="880" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="880" dy="0">MOCK 기본 경로</tspan></text><text x="140" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="140" dy="0">파일 확인 완료</tspan><tspan x="140" dy="48">EasyOCR 실행</tspan><tspan x="140" dy="48">MOCK JSON 추출</tspan></text><text x="700" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="700" dy="0">업로드를 읽지 않음</tspan><tspan x="700" dy="48">샘플 OCR 사용</tspan><tspan x="700" dy="48">MOCK JSON 추출</tspan></text><line x1="565" y1="330" x2="619" y2="330" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 615 318 L 635 330 L 615 342" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="525" width="840" height="58" rx="18" fill="#173B57"/><text x="600" y="563" text-anchor="middle" font-size="23" font-weight="600" fill="#FFFFFF"><tspan x="600" dy="0">사용자는 어떤 단계가 실제이고 mock인지 항상 알 수 있어야 합니다.</tspan></text>

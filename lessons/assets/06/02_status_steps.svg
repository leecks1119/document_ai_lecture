<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">처리 상태를 숨기지 않기</title>
  <desc id="desc">문서 처리 각 단계가 실제 또는 mock 사용으로 표시된 상태 화면</desc>
  <rect width="1200" height="675" fill="#FFF9EF"/>
  <rect x="36" y="32" width="1128" height="611" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

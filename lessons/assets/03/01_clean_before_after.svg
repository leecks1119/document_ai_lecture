<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">정제 전과 후</title>
  <desc id="desc">OCR 원문과 공백·줄바꿈만 정리한 결과를 비교</desc>
  <rect width="1200" height="675" fill="#FFF9EF"/>
  <rect x="36" y="32" width="1128" height="611" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="92" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#173B57">정제 전과 후</text>
  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="95" y="165" width="450" height="330" rx="26" fill="#EAF1F8" stroke="#CBD5E1" stroke-width="2"/><rect x="655" y="165" width="450" height="330" rx="26" fill="#DDF3EE" stroke="#CBD5E1" stroke-width="2"/><text x="320" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="320" dy="0">OCR 원문</tspan></text><text x="880" y="220" text-anchor="middle" font-size="30" font-weight="600" fill="#173B57"><tspan x="880" dy="0">정제 결과</tspan></text><text x="140" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="140" dy="0">합계:   5,000원</tspan><tspan x="140" dy="48">연필  2개 × 1,000원</tspan><tspan x="140" dy="48">불규칙한 공백</tspan></text><text x="700" y="285" text-anchor="start" font-size="24" font-weight="400" fill="#667085"><tspan x="700" dy="0">합계: 5,000원</tspan><tspan x="700" dy="48">연필 2개 × 1,000원</tspan><tspan x="700" dy="48">원문은 따로 보존</tspan></text><line x1="565" y1="330" x2="619" y2="330" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 615 318 L 635 330 L 615 342" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="525" width="840" height="58" rx="18" fill="#173B57"/><text x="600" y="563" text-anchor="middle" font-size="23" font-weight="600" fill="#FFFFFF"><tspan x="600" dy="0">정제는 표현을 정돈할 뿐, 없는 값을 새로 만들지 않습니다.</tspan></text>
  </g>
  <text x="76" y="615" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#667085">Document AI 입문 과정 · 2026</text>

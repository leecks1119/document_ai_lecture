  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect x="172" y="215" width="190" height="190" rx="22" fill="#DDF3EE" stroke="#167D7F" stroke-width="2"/><circle cx="267" cy="263" r="25" fill="#167D7F"/><text x="267" y="272" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="267" dy="0">1</tspan></text><text x="267" y="323" text-anchor="middle" font-size="25" font-weight="600" fill="#173B57"><tspan x="267" dy="0">파일</tspan></text><text x="267" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#667085"><tspan x="267" dy="0">입력</tspan></text><line x1="367" y1="310" x2="373" y2="310" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 369 298 L 389 310 L 369 322" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="215" width="190" height="190" rx="22" fill="#EAF1F8" stroke="#167D7F" stroke-width="2"/><circle cx="489" cy="263" r="25" fill="#167D7F"/><text x="489" y="272" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="489" dy="0">2</tspan></text><text x="489" y="323" text-anchor="middle" font-size="25" font-weight="600" fill="#173B57"><tspan x="489" dy="0">버튼</tspan></text><text x="489" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#667085"><tspan x="489" dy="0">이벤트</tspan></text><line x1="589" y1="310" x2="595" y2="310" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 591 298 L 611 310 L 591 322" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="616" y="215" width="190" height="190" rx="22" fill="#DDF3EE" stroke="#167D7F" stroke-width="2"/><circle cx="711" cy="263" r="25" fill="#167D7F"/><text x="711" y="272" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="711" dy="0">3</tspan></text><text x="711" y="323" text-anchor="middle" font-size="25" font-weight="600" fill="#173B57"><tspan x="711" dy="0">Python 함수</tspan></text><text x="711" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#667085"><tspan x="711" dy="0">처리</tspan></text><line x1="811" y1="310" x2="817" y2="310" stroke="#167D7F" stroke-width="6" stroke-linecap="round"/><path d="M 813 298 L 833 310 L 813 322" fill="none" stroke="#167D7F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="838" y="215" width="190" height="190" rx="22" fill="#EAF1F8" stroke="#167D7F" stroke-width="2"/><circle cx="933" cy="263" r="25" fill="#167D7F"/><text x="933" y="272" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="933" dy="0">4</tspan></text><text x="933" y="323" text-anchor="middle" font-size="25" font-weight="600" fill="#173B57"><tspan x="933" dy="0">텍스트·JSON</tspan></text><text x="933" y="381" text-anchor="middle" font-size="18" font-weight="400" fill="#667085"><tspan x="933" dy="0">출력</tspan></text><rect x="150" y="460" width="900" height="82" rx="20" fill="#173B57"/><text x="600" y="510" text-anchor="middle" font-size="25" font-weight="600" fill="#FFFFFF"><tspan x="600" dy="0">Gradio는 이미 만든 Python 함수에 화면을 붙입니다.</tspan></text>
